name: symbolize
description: >-
  Deobfuscate Dart/Flutter release stack traces. Archives versioned
  --split-debug-info symbols and decodes crashes by build_id — CLI and
  library, powered by the same DWARF engine as `flutter symbolize`.
version: 0.1.0
repository: https://github.com/zhukeev/symbolize
topics:
  - stack-trace
  - obfuscation
  - crash-reporting
  - symbols
  - dwarf

environment:
  sdk: ^3.9.0

executables:
  symbolize:

dependencies:
  args: ^2.7.0
  native_stack_traces: ^0.7.1
  path: ^1.9.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.0
